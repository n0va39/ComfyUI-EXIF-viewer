name: Signed Release Candidate

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-sign:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $required = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
          }
          $missing = @($required.Keys | Where-Object {
            [string]::IsNullOrWhiteSpace($required[$_])
          })
          if ($missing.Count -gt 0) {
            throw "Missing SignPath configuration: $($missing -join ', ')"
          }

      - name: Verify tag points to current main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch origin/main."
          }
          $mainSha = (git rev-parse origin/main).Trim()
          if ($mainSha -ne $env:GITHUB_SHA) {
            throw "Release tag must point to the current origin/main commit."
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build unsigned release candidate
        shell: pwsh
        run: ./scripts/build_windows.ps1 -PythonCommand python

      - name: Verify release version and unsigned input
        id: release-version
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\ComfyUI-EXIF-viewer.exe"
          $version = (& .\.venv\Scripts\python.exe -c `
            "from comfy_exif_viewer import APP_VERSION; print(APP_VERSION)"
          ).Trim()
          $fileVersion = (Get-Item -LiteralPath $exe).VersionInfo.FileVersion.Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $version."
          }
          if ($fileVersion -ne "$version.0") {
            throw "PE file version $fileVersion does not match $version.0."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne "NotSigned") {
            throw "SignPath input must be unsigned; found $($signature.Status)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned artifact for origin verification
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-${{ github.ref_name }}
          path: dist/ComfyUI-EXIF-viewer.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit SignPath signing request
        id: signpath
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: "${{ steps.release-version.outputs.version }}"
            fileVersion: "${{ steps.release-version.outputs.file_version }}"

      - name: Verify signed executable and prepare release candidate
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          $signedFiles = @(Get-ChildItem -Path signed -Recurse -File `
            -Filter "ComfyUI-EXIF-viewer.exe")
          if ($signedFiles.Count -ne 1) {
            throw "Expected exactly one signed executable; found $($signedFiles.Count)."
          }

          New-Item -ItemType Directory -Path release -Force | Out-Null
          $targetExe = Join-Path $PWD "release\ComfyUI-EXIF-viewer.exe"
          Copy-Item -LiteralPath $signedFiles[0].FullName -Destination $targetExe

          $signature = Get-AuthenticodeSignature -LiteralPath $targetExe
          if ($signature.Status -ne "Valid") {
            throw "Signed executable failed Authenticode verification: $($signature.Status)."
          }
          if ($signature.SignerCertificate.Subject -notmatch "SignPath Foundation") {
            throw "Unexpected Authenticode publisher: $($signature.SignerCertificate.Subject)"
          }

          $versionOutput = (& $targetExe --version).Trim()
          $expectedOutput = "ComfyUI-EXIF-viewer.exe $env:RELEASE_VERSION"
          if ($versionOutput -ne $expectedOutput) {
            throw "Signed executable version check failed: $versionOutput"
          }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $targetExe).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "release\SHA256SUMS.txt" `
            -Value "$hash  ComfyUI-EXIF-viewer.exe" -Encoding ascii
          Copy-Item -LiteralPath LICENSE -Destination "release\LICENSE.txt"
          Copy-Item -LiteralPath THIRD_PARTY_NOTICES.md -Destination release

      - name: Upload signed release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-windows-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
